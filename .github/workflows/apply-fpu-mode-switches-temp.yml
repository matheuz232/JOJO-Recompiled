name: apply-fpu-mode-switches-temp

on:
  push:
    branches:
      - feature/sh4-fpu-mode-switches-impl
    paths:
      - .github/workflows/apply-fpu-mode-switches-temp.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sh4-fpu-mode-switches-impl
          fetch-depth: 0

      - name: Apply minimal FRCHG/FSCHG implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected marker once, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/core/sh4_decoder.h",
              "    fldi0,\n    fldi1,\n    flds,\n    fsts,\n",
              "    fldi0,\n    fldi1,\n    flds,\n    fsts,\n    frchg,\n    fschg,\n",
              "decoder FPU mode enum",
          )

          replace_once(
              "src/core/sh4_decoder.cpp",
              "    if (fpu_transfer_code == 0xF00Du) {\n"
              "        i.op = Sh4Op::fsts;\n"
              "        i.rn = n_field(raw);\n"
              "        return i;\n"
              "    }\n",
              "    if (fpu_transfer_code == 0xF00Du) {\n"
              "        i.op = Sh4Op::fsts;\n"
              "        i.rn = n_field(raw);\n"
              "        return i;\n"
              "    }\n"
              "    if (raw == 0xFBFDu) {\n"
              "        i.op = Sh4Op::frchg;\n"
              "        return i;\n"
              "    }\n"
              "    if (raw == 0xF3FDu) {\n"
              "        i.op = Sh4Op::fschg;\n"
              "        return i;\n"
              "    }\n",
              "decoder FRCHG/FSCHG",
          )

          replace_once(
              "src/core/sh4_ir.h",
              "    copy_fr_to_fpul,\n    copy_fpul_to_fr,\n",
              "    copy_fr_to_fpul,\n    copy_fpul_to_fr,\n    toggle_fpscr_fr,\n    toggle_fpscr_sz,\n",
              "IR FPU mode enum",
          )

          replace_once(
              "src/core/sh4_ir.cpp",
              "        case Sh4Op::flds: out.op = Sh4IrOp::copy_fr_to_fpul; break;\n"
              "        case Sh4Op::fsts: out.op = Sh4IrOp::copy_fpul_to_fr; break;\n",
              "        case Sh4Op::flds: out.op = Sh4IrOp::copy_fr_to_fpul; break;\n"
              "        case Sh4Op::fsts: out.op = Sh4IrOp::copy_fpul_to_fr; break;\n"
              "        case Sh4Op::frchg: out.op = Sh4IrOp::toggle_fpscr_fr; break;\n"
              "        case Sh4Op::fschg: out.op = Sh4IrOp::toggle_fpscr_sz; break;\n",
              "IR FRCHG/FSCHG lift",
          )

          replace_once(
              "src/core/sh4_reference_executor.cpp",
              "constexpr std::uint32_t kFpscrWritableMask = 0x003FFFFFu;\n"
              "constexpr std::uint32_t kFpscrFrBit = 0x00200000u;\n",
              "constexpr std::uint32_t kFpscrWritableMask = 0x003FFFFFu;\n"
              "constexpr std::uint32_t kFpscrFrBit = 0x00200000u;\n"
              "constexpr std::uint32_t kFpscrSzBit = 0x00100000u;\n",
              "FPSCR mode constants",
          )

          replace_once(
              "src/core/sh4_reference_executor.cpp",
              "        case Sh4IrOp::copy_fpul_to_fr: {\n"
              "            auto dst = require_register(instruction.dst_reg);\n"
              "            if (!dst) return dst;\n"
              "            state.fr[instruction.dst_reg] = state.fpul;\n"
              "            return Result<void>::success();\n"
              "        }\n",
              "        case Sh4IrOp::copy_fpul_to_fr: {\n"
              "            auto dst = require_register(instruction.dst_reg);\n"
              "            if (!dst) return dst;\n"
              "            state.fr[instruction.dst_reg] = state.fpul;\n"
              "            return Result<void>::success();\n"
              "        }\n"
              "        case Sh4IrOp::toggle_fpscr_fr:\n"
              "            write_fpscr(state, state.fpscr ^ kFpscrFrBit);\n"
              "            return Result<void>::success();\n"
              "        case Sh4IrOp::toggle_fpscr_sz:\n"
              "            write_fpscr(state, state.fpscr ^ kFpscrSzBit);\n"
              "            return Result<void>::success();\n",
              "executor FRCHG/FSCHG",
          )
          PY

      - name: Check diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.cpp

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.cpp
          git commit -m "SH-4: execute FRCHG and FSCHG"
          git push origin HEAD:feature/sh4-fpu-mode-switches-impl
