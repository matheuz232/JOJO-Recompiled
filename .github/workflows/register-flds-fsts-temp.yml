name: register-flds-fsts-temp

on:
  push:
    branches:
      - feature/sh4-flds-fsts
    paths:
      - .github/workflows/register-flds-fsts-temp.yml

permissions:
  contents: write

jobs:
  register-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sh4-flds-fsts
          fetch-depth: 0
      - name: Register test target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          marker = "add_test(NAME jojo_sh4_fpscr_bank_tests COMMAND jojo_sh4_fpscr_bank_tests)"
          if text.count(marker) != 1:
              raise SystemExit("FPSCR CMake marker not found exactly once")
          addition = (
              marker + "\n"
              "add_executable(jojo_sh4_flds_fsts_tests tests/test_sh4_flds_fsts.cpp)\n"
              "target_link_libraries(jojo_sh4_flds_fsts_tests PRIVATE jojo_core)\n"
              "add_test(NAME jojo_sh4_flds_fsts_tests COMMAND jojo_sh4_flds_fsts_tests)"
          )
          path.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Commit test registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "test: register SH-4 FLDS/FSTS coverage"
          git push origin HEAD:feature/sh4-flds-fsts
