name: apply-fpscr-temp

on:
  push:
    branches:
      - feature/sh4-fpscr-banks
    paths:
      - .github/workflows/apply-fpscr-temp.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sh4-fpscr-banks
          fetch-depth: 0

      - name: Apply minimal FPSCR implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected marker once, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/core/sh4_decoder.h",
              "    lds_fpul_reg,\n    sts_fpul_reg,\n    lds_fpul_postinc,\n    sts_fpul_predec,\n",
              "    lds_fpul_reg,\n    sts_fpul_reg,\n    lds_fpul_postinc,\n    sts_fpul_predec,\n"
              "    lds_fpscr_reg,\n    sts_fpscr_reg,\n    lds_fpscr_postinc,\n    sts_fpscr_predec,\n",
              "decoder enum",
          )

          replace_once(
              "src/core/sh4_decoder.cpp",
              "    if (control_code == 0x4052u) { i.op = Sh4Op::sts_fpul_predec; i.rn = n_field(raw); return i; }\n",
              "    if (control_code == 0x4052u) { i.op = Sh4Op::sts_fpul_predec; i.rn = n_field(raw); return i; }\n"
              "    if (control_code == 0x406Au) { i.op = Sh4Op::lds_fpscr_reg; i.rm = n_field(raw); return i; }\n"
              "    if (control_code == 0x006Au) { i.op = Sh4Op::sts_fpscr_reg; i.rn = n_field(raw); return i; }\n"
              "    if (control_code == 0x4066u) { i.op = Sh4Op::lds_fpscr_postinc; i.rm = n_field(raw); return i; }\n"
              "    if (control_code == 0x4062u) { i.op = Sh4Op::sts_fpscr_predec; i.rn = n_field(raw); return i; }\n",
              "decoder FPSCR forms",
          )

          replace_once(
              "src/core/sh4_ir.h",
              "    set_fpul_from_reg,\n    copy_fpul_to_reg,\n    load_fpul_postinc32,\n    store_fpul_predec32,\n",
              "    set_fpul_from_reg,\n    copy_fpul_to_reg,\n    load_fpul_postinc32,\n    store_fpul_predec32,\n"
              "    set_fpscr_from_reg,\n    copy_fpscr_to_reg,\n    load_fpscr_postinc32,\n    store_fpscr_predec32,\n",
              "IR enum",
          )

          replace_once(
              "src/core/sh4_ir.cpp",
              "        case Sh4Op::lds_fpul_reg: out.op = Sh4IrOp::set_fpul_from_reg; break;\n"
              "        case Sh4Op::sts_fpul_reg: out.op = Sh4IrOp::copy_fpul_to_reg; break;\n"
              "        case Sh4Op::lds_fpul_postinc: out.op = Sh4IrOp::load_fpul_postinc32; break;\n"
              "        case Sh4Op::sts_fpul_predec: out.op = Sh4IrOp::store_fpul_predec32; break;\n",
              "        case Sh4Op::lds_fpul_reg: out.op = Sh4IrOp::set_fpul_from_reg; break;\n"
              "        case Sh4Op::sts_fpul_reg: out.op = Sh4IrOp::copy_fpul_to_reg; break;\n"
              "        case Sh4Op::lds_fpul_postinc: out.op = Sh4IrOp::load_fpul_postinc32; break;\n"
              "        case Sh4Op::sts_fpul_predec: out.op = Sh4IrOp::store_fpul_predec32; break;\n"
              "        case Sh4Op::lds_fpscr_reg: out.op = Sh4IrOp::set_fpscr_from_reg; break;\n"
              "        case Sh4Op::sts_fpscr_reg: out.op = Sh4IrOp::copy_fpscr_to_reg; break;\n"
              "        case Sh4Op::lds_fpscr_postinc: out.op = Sh4IrOp::load_fpscr_postinc32; break;\n"
              "        case Sh4Op::sts_fpscr_predec: out.op = Sh4IrOp::store_fpscr_predec32; break;\n",
              "IR lift",
          )

          replace_once(
              "src/core/sh4_reference_executor.h",
              "    std::array<std::uint32_t, 16> fr{};\n    std::uint32_t fpul{};\n",
              "    std::array<std::uint32_t, 16> fr{};\n"
              "    std::array<std::uint32_t, 16> xf{};\n"
              "    std::uint32_t fpul{};\n"
              "    std::uint32_t fpscr{0x00040001u};\n",
              "reference FPU state",
          )

          replace_once(
              "src/core/sh4_reference_executor.cpp",
              "#include <optional>\n",
              "#include <optional>\n#include <utility>\n",
              "executor utility include",
          )

          replace_once(
              "src/core/sh4_reference_executor.cpp",
              "std::int32_t as_signed(std::uint32_t value) noexcept {\n"
              "    return std::bit_cast<std::int32_t>(value);\n"
              "}\n",
              "std::int32_t as_signed(std::uint32_t value) noexcept {\n"
              "    return std::bit_cast<std::int32_t>(value);\n"
              "}\n\n"
              "constexpr std::uint32_t kFpscrWritableMask = 0x003FFFFFu;\n"
              "constexpr std::uint32_t kFpscrFrBit = 0x00200000u;\n\n"
              "void write_fpscr(Sh4ReferenceState& state, std::uint32_t value) noexcept {\n"
              "    const auto masked = value & kFpscrWritableMask;\n"
              "    if (((state.fpscr ^ masked) & kFpscrFrBit) != 0u) {\n"
              "        std::swap(state.fr, state.xf);\n"
              "    }\n"
              "    state.fpscr = masked;\n"
              "}\n",
              "FPSCR write helper",
          )

          fpul_tail = (
              "        case Sh4IrOp::store_fpul_predec32: {\n"
              "            auto dst = require_register(instruction.dst_reg);\n"
              "            if (!dst) return dst;\n"
              "            const auto address = state.r[instruction.dst_reg] - 4u;\n"
              "            auto stored = write_u32(memory, address, state.fpul);\n"
              "            if (!stored) return stored;\n"
              "            state.r[instruction.dst_reg] = address;\n"
              "            return Result<void>::success();\n"
              "        }\n"
          )
          fpscr_cases = (
              fpul_tail
              + "        case Sh4IrOp::set_fpscr_from_reg: {\n"
              "            auto src = require_register(instruction.src_reg);\n"
              "            if (!src) return src;\n"
              "            write_fpscr(state, state.r[instruction.src_reg]);\n"
              "            return Result<void>::success();\n"
              "        }\n"
              "        case Sh4IrOp::copy_fpscr_to_reg: {\n"
              "            auto dst = require_register(instruction.dst_reg);\n"
              "            if (!dst) return dst;\n"
              "            state.r[instruction.dst_reg] = state.fpscr;\n"
              "            return Result<void>::success();\n"
              "        }\n"
              "        case Sh4IrOp::load_fpscr_postinc32: {\n"
              "            auto src = require_register(instruction.src_reg);\n"
              "            if (!src) return src;\n"
              "            const auto address = state.r[instruction.src_reg];\n"
              "            auto value = read_u32(memory, address);\n"
              "            if (!value) return Result<void>::failure(value.error, value.detail);\n"
              "            write_fpscr(state, value.value);\n"
              "            state.r[instruction.src_reg] += 4u;\n"
              "            return Result<void>::success();\n"
              "        }\n"
              "        case Sh4IrOp::store_fpscr_predec32: {\n"
              "            auto dst = require_register(instruction.dst_reg);\n"
              "            if (!dst) return dst;\n"
              "            const auto address = state.r[instruction.dst_reg] - 4u;\n"
              "            auto stored = write_u32(memory, address, state.fpscr);\n"
              "            if (!stored) return stored;\n"
              "            state.r[instruction.dst_reg] = address;\n"
              "            return Result<void>::success();\n"
              "        }\n"
          )
          replace_once(
              "src/core/sh4_reference_executor.cpp",
              fpul_tail,
              fpscr_cases,
              "FPSCR executor cases",
          )
          PY

      - name: Check diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.h src/core/sh4_reference_executor.cpp

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.h src/core/sh4_reference_executor.cpp
          git commit -m "SH-4: execute FPSCR bank control"
          git push origin HEAD:feature/sh4-fpscr-banks
