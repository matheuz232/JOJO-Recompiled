name: agent-apply-sh4-system

on:
  push:
    branches:
      - feature/sh4-cpu-system-completion
    paths:
      - .agent/apply_sh4_system.py
      - .github/workflows/agent-apply-sh4-system.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize applicator anchors for current sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.agent/apply_sh4_system.py')
          text = p.read_text(encoding='utf-8')
          one_off = [
              (
                  '"#include <string>\\n#include <vector>\\n",\n    "#include <string>\\n#include <utility>\\n#include <vector>\\n",',
                  '"#include <span>\\n#include <string>\\n",\n    "#include <span>\\n#include <string>\\n#include <utility>\\n",',
              ),
              (
                  '"enum class Sh4ReferenceStopReason {\\n    left_program,\\n    end_of_stream,\\n    block_limit,\\n};\\n",',
                  '"enum class Sh4ReferenceStopReason {\\n    end_of_stream,\\n    left_program,\\n    block_limit,\\n};\\n",',
              ),
              (
                  '"    state.sr |= kSrMd | kSrRb | kSrBl;\\n",',
                  '"    state.sr |= kSrBl | kSrRb | kSrMd;\\n",',
              ),
          ]
          for old, new in one_off:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one stale applicator anchor: {old[:80]}')
              text = text.replace(old, new, 1)

          grouped = [
              (
                  '"        case Sh4IrOp::set_mach_from_reg: {\\n"',
                  '"        case Sh4IrOp::set_mach_from_reg:\\n        case Sh4IrOp::set_macl_from_reg:\\n        case Sh4IrOp::set_pr_from_reg: {\\n"',
              ),
              (
                  '"        case Sh4IrOp::multiply_unsigned_long: {\\n"',
                  '"        case Sh4IrOp::multiply_low32:\\n        case Sh4IrOp::multiply_signed_word:\\n        case Sh4IrOp::multiply_unsigned_word:\\n        case Sh4IrOp::multiply_signed_long:\\n        case Sh4IrOp::multiply_unsigned_long: {\\n"',
              ),
          ]
          for old, new in grouped:
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'expected two grouped applicator anchors, found {count}: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply SH-4 system/control implementation
        run: python3 .agent/apply_sh4_system.py
      - name: Commit implementation and remove applicator
        run: |
          rm .agent/apply_sh4_system.py .github/workflows/agent-apply-sh4-system.yml
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete SH-4 system and MAC instruction families"
          git push origin HEAD:${GITHUB_REF_NAME}
