name: apply-flds-fsts-temp

on:
  push:
    branches:
      - feature/sh4-flds-fsts
    paths:
      - .github/workflows/apply-flds-fsts-temp.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sh4-flds-fsts
          fetch-depth: 0

      - name: Apply minimal FLDS/FSTS implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected marker once, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/core/sh4_decoder.h",
              "    fldi0,\n    fldi1,\n",
              "    fldi0,\n    fldi1,\n    flds,\n    fsts,\n",
              "decoder FPU enum",
          )

          replace_once(
              "src/core/sh4_decoder.cpp",
              "    const auto fpu_constant_code = static_cast<std::uint16_t>(raw & 0xF0FFu);\n"
              "    if (fpu_constant_code == 0xF08Du || fpu_constant_code == 0xF09Du) {\n"
              "        i.op = fpu_constant_code == 0xF08Du ? Sh4Op::fldi0 : Sh4Op::fldi1;\n"
              "        i.rn = n_field(raw);\n"
              "        return i;\n"
              "    }\n",
              "    const auto fpu_constant_code = static_cast<std::uint16_t>(raw & 0xF0FFu);\n"
              "    if (fpu_constant_code == 0xF08Du || fpu_constant_code == 0xF09Du) {\n"
              "        i.op = fpu_constant_code == 0xF08Du ? Sh4Op::fldi0 : Sh4Op::fldi1;\n"
              "        i.rn = n_field(raw);\n"
              "        return i;\n"
              "    }\n\n"
              "    const auto fpu_transfer_code = static_cast<std::uint16_t>(raw & 0xF0FFu);\n"
              "    if (fpu_transfer_code == 0xF01Du) {\n"
              "        i.op = Sh4Op::flds;\n"
              "        i.rm = n_field(raw);\n"
              "        return i;\n"
              "    }\n"
              "    if (fpu_transfer_code == 0xF00Du) {\n"
              "        i.op = Sh4Op::fsts;\n"
              "        i.rn = n_field(raw);\n"
              "        return i;\n"
              "    }\n",
              "decoder FLDS/FSTS",
          )

          replace_once(
              "src/core/sh4_ir.h",
              "    set_fr_zero,\n    set_fr_one,\n",
              "    set_fr_zero,\n    set_fr_one,\n    copy_fr_to_fpul,\n    copy_fpul_to_fr,\n",
              "IR FPU enum",
          )

          replace_once(
              "src/core/sh4_ir.cpp",
              "        case Sh4Op::fldi0: out.op = Sh4IrOp::set_fr_zero; break;\n"
              "        case Sh4Op::fldi1: out.op = Sh4IrOp::set_fr_one; break;\n",
              "        case Sh4Op::fldi0: out.op = Sh4IrOp::set_fr_zero; break;\n"
              "        case Sh4Op::fldi1: out.op = Sh4IrOp::set_fr_one; break;\n"
              "        case Sh4Op::flds: out.op = Sh4IrOp::copy_fr_to_fpul; break;\n"
              "        case Sh4Op::fsts: out.op = Sh4IrOp::copy_fpul_to_fr; break;\n",
              "IR FLDS/FSTS lift",
          )

          replace_once(
              "src/core/sh4_reference_executor.cpp",
              "        case Sh4IrOp::set_fr_zero:\n"
              "        case Sh4IrOp::set_fr_one: {\n"
              "            auto reg = require_register(instruction.dst_reg);\n"
              "            if (!reg) return reg;\n"
              "            state.fr[instruction.dst_reg] = instruction.op == Sh4IrOp::set_fr_zero\n"
              "                ? 0x00000000u\n"
              "                : 0x3F800000u;\n"
              "            return Result<void>::success();\n"
              "        }\n",
              "        case Sh4IrOp::set_fr_zero:\n"
              "        case Sh4IrOp::set_fr_one: {\n"
              "            auto reg = require_register(instruction.dst_reg);\n"
              "            if (!reg) return reg;\n"
              "            state.fr[instruction.dst_reg] = instruction.op == Sh4IrOp::set_fr_zero\n"
              "                ? 0x00000000u\n"
              "                : 0x3F800000u;\n"
              "            return Result<void>::success();\n"
              "        }\n"
              "        case Sh4IrOp::copy_fr_to_fpul: {\n"
              "            auto src = require_register(instruction.src_reg);\n"
              "            if (!src) return src;\n"
              "            state.fpul = state.fr[instruction.src_reg];\n"
              "            return Result<void>::success();\n"
              "        }\n"
              "        case Sh4IrOp::copy_fpul_to_fr: {\n"
              "            auto dst = require_register(instruction.dst_reg);\n"
              "            if (!dst) return dst;\n"
              "            state.fr[instruction.dst_reg] = state.fpul;\n"
              "            return Result<void>::success();\n"
              "        }\n",
              "executor FLDS/FSTS",
          )
          PY

      - name: Check diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.cpp

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.cpp
          git commit -m "SH-4: execute FLDS and FSTS"
          git push origin HEAD:feature/sh4-flds-fsts
