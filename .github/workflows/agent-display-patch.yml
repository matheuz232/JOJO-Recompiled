name: agent-display-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-display-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow GPU display patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/core/psx_bus.h')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    static constexpr std::uint32_t gpu_status_reset = 0x14802000u;\n'
              '    static constexpr std::uint32_t gpu_status_display_disabled = 1u << 23u;\n',
              '    static constexpr std::uint32_t gpu_status_reset = 0x14802000u;\n'
              '    static constexpr std::uint32_t gpu_status_display_disabled = 1u << 23u;\n'
              '    static constexpr std::uint32_t gpu_horizontal_display_range_reset =\n'
              '        0x200u | ((0x200u + 256u * 10u) << 12u);\n'
              '    static constexpr std::uint32_t gpu_vertical_display_range_reset =\n'
              '        0x010u | ((0x010u + 240u) << 10u);\n')

          replace_once(
              '    std::uint32_t gpu_drawing_offset{};\n'
              '    std::vector<std::uint16_t> gpu_vram =\n',
              '    std::uint32_t gpu_drawing_offset{};\n'
              '    std::uint32_t gpu_display_vram_start{};\n'
              '    std::uint32_t gpu_horizontal_display_range{gpu_horizontal_display_range_reset};\n'
              '    std::uint32_t gpu_vertical_display_range{gpu_vertical_display_range_reset};\n'
              '    std::uint8_t gpu_display_mode{};\n'
              '    std::vector<std::uint16_t> gpu_vram =\n')

          replace_once(
              '        switch (command) {\n'
              '        case 0xe1u:\n',
              '        switch (command) {\n'
              '        case 0x1fu:\n'
              '            bus.gpu_status |= 1u << 24u;\n'
              '            return;\n'
              '        case 0xe1u:\n')

          replace_once(
              '            bus.gpu_drawing_area_bottom_right = 0u;\n'
              '            bus.gpu_drawing_offset = 0u;\n'
              '            bus.gpu_gp0_packet = {};\n',
              '            bus.gpu_drawing_area_bottom_right = 0u;\n'
              '            bus.gpu_drawing_offset = 0u;\n'
              '            bus.gpu_display_vram_start = 0u;\n'
              '            bus.gpu_horizontal_display_range = PsxBus::gpu_horizontal_display_range_reset;\n'
              '            bus.gpu_vertical_display_range = PsxBus::gpu_vertical_display_range_reset;\n'
              '            bus.gpu_display_mode = 0u;\n'
              '            bus.gpu_gp0_packet = {};\n')

          replace_once(
              '        if (command == 0x10u) {\n',
              '        if (command == 0x01u) {\n'
              '            bus.gpu_gp0_packet = {};\n'
              '            bus.gpu_gp0_packet_count = 0u;\n'
              '            bus.gpu_gp0_packet_words = 0u;\n'
              '            bus.gpu_polyline_active = false;\n'
              '            bus.gpu_polyline_gouraud = false;\n'
              '            bus.gpu_polyline_expect_color = false;\n'
              '            return PsxBusAccessReason::ok;\n'
              '        }\n'
              '        if (command == 0x02u) {\n'
              '            bus.gpu_status &= ~(1u << 24u);\n'
              '            return PsxBusAccessReason::ok;\n'
              '        }\n'
              '        if (command == 0x05u) {\n'
              '            bus.gpu_display_vram_start = value & 0x0007ffffu;\n'
              '            return PsxBusAccessReason::ok;\n'
              '        }\n'
              '        if (command == 0x06u) {\n'
              '            bus.gpu_horizontal_display_range = value & 0x00ffffffu;\n'
              '            return PsxBusAccessReason::ok;\n'
              '        }\n'
              '        if (command == 0x07u) {\n'
              '            bus.gpu_vertical_display_range = value & 0x000fffffu;\n'
              '            return PsxBusAccessReason::ok;\n'
              '        }\n'
              '        if (command == 0x08u) {\n'
              '            const auto mode = static_cast<std::uint8_t>(value & 0xffu);\n'
              '            bus.gpu_display_mode = mode;\n'
              '            constexpr std::uint32_t display_status_mask = 0x007f0000u;\n'
              '            const auto display_status =\n'
              '                (static_cast<std::uint32_t>(mode & 0x03u) << 17u) |\n'
              '                (static_cast<std::uint32_t>(mode & 0x3cu) << 17u) |\n'
              '                (static_cast<std::uint32_t>(mode & 0x40u) << 10u);\n'
              '            bus.gpu_status = (bus.gpu_status & ~display_status_mask) | display_status;\n'
              '            return PsxBusAccessReason::ok;\n'
              '        }\n'
              '        if (command == 0x10u) {\n')

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/core/psx_bus.h
      - name: Commit display implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/psx_bus.h
          git commit -m 'feat: implement PS1 GPU display control'
          git push origin HEAD:feature/offline-product-rebuild
