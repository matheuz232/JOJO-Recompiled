name: m6-sha-green

on:
  push:
    branches: [feature/m6-mod-runtime]
    paths:
      - 'src/core/sha256.h'
      - 'src/core/sha256.cpp'
      - 'tests/test_sha256.cpp'
      - '.github/workflows/m6-sha-green.yml'

jobs:
  sha256-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SHA-256 test
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc tests/test_sha256.cpp src/core/sha256.cpp -o /tmp/test_sha256
      - name: Run SHA-256 test
        run: /tmp/test_sha256
