name: agent-timer0-dotclock-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-timer0-dotclock-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Timer0 dotclock implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/core/psx_bus.h')
          text = path.read_text()

          old_fields = "    std::uint8_t timer2_clock_phase{};\n    std::uint64_t video_clock_phase{};"
          new_fields = "    std::uint8_t timer2_clock_phase{};\n    std::uint64_t timer0_dotclock_cpu_phase{};\n    std::uint16_t timer0_video_clock_phase{};\n    std::uint64_t video_clock_phase{};"
          assert text.count(old_fields) == 1, 'dotclock field anchor changed'
          text = text.replace(old_fields, new_fields)

          old_block = '''    const bool timer0_system_clock_allowed =
              !timer0_sync || timer0_sync_mode == 1u ||
              (timer0_sync_mode == 3u && bus.timer0_sync_started);
          if (timer0_system_clock_allowed) {
              const auto source = static_cast<std::uint16_t>((bus.timer0_mode >> 8u) & 3u);
              if (source == 0u || source == 2u) {
                  psx_bus_tick_root_counter(bus, bus.timer0_current, bus.timer0_mode,
                                            bus.timer0_target, bus.timer0_reset_pending,
                                            bus.timer0_irq_fired, timer0_interrupt, cpu_cycles);
              }
          }
          '''
          new_block = '''    const bool timer0_clock_allowed =
              !timer0_sync || timer0_sync_mode == 1u ||
              (timer0_sync_mode == 3u && bus.timer0_sync_started);
          constexpr std::uint64_t cpu_clock_hz = 33'868'800u;
          constexpr std::uint64_t video_clock_hz = 53'693'175u;
          constexpr std::uint16_t dotclock_phase_period = 280u;
          const auto dotclock_numerator =
              bus.timer0_dotclock_cpu_phase +
              static_cast<std::uint64_t>(cpu_cycles) * video_clock_hz;
          const auto elapsed_video_clocks = dotclock_numerator / cpu_clock_hz;
          bus.timer0_dotclock_cpu_phase = dotclock_numerator % cpu_clock_hz;
          const auto video_phase_before = bus.timer0_video_clock_phase;
          bus.timer0_video_clock_phase = static_cast<std::uint16_t>(
              (static_cast<std::uint64_t>(video_phase_before) + elapsed_video_clocks) %
              dotclock_phase_period);

          if (timer0_clock_allowed) {
              const auto source = static_cast<std::uint16_t>((bus.timer0_mode >> 8u) & 3u);
              if (source == 0u || source == 2u) {
                  psx_bus_tick_root_counter(bus, bus.timer0_current, bus.timer0_mode,
                                            bus.timer0_target, bus.timer0_reset_pending,
                                            bus.timer0_irq_fired, timer0_interrupt, cpu_cycles);
              } else {
                  const auto horizontal_mode = static_cast<std::uint8_t>(bus.gpu_display_mode);
                  const std::uint32_t divider =
                      (horizontal_mode & 0x40u) != 0u ? 7u :
                      (horizontal_mode & 0x03u) == 0u ? 10u :
                      (horizontal_mode & 0x03u) == 1u ? 8u :
                      (horizontal_mode & 0x03u) == 2u ? 5u : 4u;
                  const auto phase_in_divider =
                      static_cast<std::uint32_t>(video_phase_before % divider);
                  const auto dotclock_ticks = static_cast<std::uint32_t>(
                      (static_cast<std::uint64_t>(phase_in_divider) + elapsed_video_clocks) /
                      divider);
                  psx_bus_tick_root_counter(bus, bus.timer0_current, bus.timer0_mode,
                                            bus.timer0_target, bus.timer0_reset_pending,
                                            bus.timer0_irq_fired, timer0_interrupt,
                                            dotclock_ticks);
              }
          }
          '''
          assert text.count(old_block) == 1, 'Timer0 clock block anchor changed'
          text = text.replace(old_block, new_block)
          path.write_text(text)
          PY
      - name: Configure timer contract
        run: cmake -S tests/psx_timer1_mode -B build/psx_timer1_mode -DCMAKE_BUILD_TYPE=Release
      - name: Build timer contract
        run: cmake --build build/psx_timer1_mode --parallel 2
      - name: Run timer contract
        run: ./build/psx_timer1_mode/jojo_psx_timer1_mode_tests
      - name: Commit Timer0 dotclock implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/psx_bus.h
          git commit -m "feat: implement PS1 Timer0 dotclock"
          git push origin HEAD:feature/offline-product-rebuild
