name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: Portable core / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Build R1 media probe
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc tools/r1_media_probe.cpp build/libjojo_core.a -ldl -o build/jojo_r1_media_probe
      - name: Upload R1 media probe
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-R1-Media-Probe-Linux
          path: build/jojo_r1_media_probe
          if-no-files-found: error

  windows-x64:
    name: Windows x64 / MSVC 2022
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-Recompiled-Windows-x64
          path: build/Release/JOJO-Recompiled.exe
          if-no-files-found: error
