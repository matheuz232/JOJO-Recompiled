name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: Portable core / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure PSX I_MASK contract
        run: cmake -S tests/psx_interrupt_mask -B build/psx_interrupt_mask -DCMAKE_BUILD_TYPE=Release
      - name: Build PSX I_MASK contract
        run: cmake --build build/psx_interrupt_mask --parallel 2
      - name: Test PSX I_MASK contract
        run: ./build/psx_interrupt_mask/jojo_psx_interrupt_mask_tests
      - name: Configure PSX I_STAT contract
        run: cmake -S tests/psx_interrupt_status -B build/psx_interrupt_status -DCMAKE_BUILD_TYPE=Release
      - name: Build PSX I_STAT contract
        run: cmake --build build/psx_interrupt_status --parallel 2
      - name: Test PSX I_STAT contract
        run: ./build/psx_interrupt_status/jojo_psx_interrupt_status_tests
      - name: Configure PSX SysDeqIntRP contract
        run: cmake -S tests/psx_sysdeqintpr -B build/psx_sysdeqintpr -DCMAKE_BUILD_TYPE=Release
      - name: Build PSX SysDeqIntRP contract
        run: cmake --build build/psx_sysdeqintpr --parallel 2
      - name: Test PSX SysDeqIntRP contract
        run: ./build/psx_sysdeqintpr/jojo_psx_sysdeqintpr_tests
      - name: Configure PSX DPCR contract
        run: cmake -S tests/psx_dma_control -B build/psx_dma_control -DCMAKE_BUILD_TYPE=Release
      - name: Build PSX DPCR contract
        run: cmake --build build/psx_dma_control --parallel 2
      - name: Test PSX DPCR contract
        run: ./build/psx_dma_control/jojo_psx_dma_control_tests
      - name: Configure PSX Timer 1 mode contract
        run: cmake -S tests/psx_timer1_mode -B build/psx_timer1_mode -DCMAKE_BUILD_TYPE=Release
      - name: Build PSX Timer 1 mode contract
        run: cmake --build build/psx_timer1_mode --parallel 2
      - name: Test PSX Timer 1 mode contract
        run: ./build/psx_timer1_mode/jojo_psx_timer1_mode_tests
      - name: Configure PSX InitCARD2 contract
        run: cmake -S tests/psx_card_init -B build/psx_card_init -DCMAKE_BUILD_TYPE=Release
      - name: Build PSX InitCARD2 contract
        run: cmake --build build/psx_card_init --parallel 2
      - name: Test PSX InitCARD2 contract
        run: ./build/psx_card_init/jojo_psx_card_init_tests
      - name: Configure R3000A foundation contract
        run: cmake -S tests/psx_r3000a_foundation -B build/psx_r3000a_foundation -DCMAKE_BUILD_TYPE=Release
      - name: Build R3000A foundation contract
        run: cmake --build build/psx_r3000a_foundation --parallel 2
      - name: Test R3000A foundation contract
        run: ./build/psx_r3000a_foundation/jojo_psx_r3000a_foundation_tests
      - name: Configure R3000A frontier contract
        run: cmake -S tests/psx_r3000a_frontier -B build/psx_r3000a_frontier -DCMAKE_BUILD_TYPE=Release
      - name: Build R3000A frontier contract
        run: cmake --build build/psx_r3000a_frontier --parallel 2
      - name: Test R3000A frontier contract
        run: ./build/psx_r3000a_frontier/jojo_psx_r3000a_frontier_tests
      - name: Build R1 media probe
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc tools/r1_media_probe.cpp build/libjojo_core.a -ldl -o build/jojo_r1_media_probe
      - name: Upload R1 media probe
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-R1-Media-Probe-Linux
          path: build/jojo_r1_media_probe
          if-no-files-found: error

  windows-x64:
    name: Windows x64 / MSVC 2022
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Configure PSX I_MASK contract
        run: cmake -S tests/psx_interrupt_mask -B build/psx_interrupt_mask -G "Visual Studio 17 2022" -A x64
      - name: Build PSX I_MASK contract
        run: cmake --build build/psx_interrupt_mask --config Release --parallel 2
      - name: Test PSX I_MASK contract
        run: .\build\psx_interrupt_mask\Release\jojo_psx_interrupt_mask_tests.exe
      - name: Configure PSX I_STAT contract
        run: cmake -S tests/psx_interrupt_status -B build/psx_interrupt_status -G "Visual Studio 17 2022" -A x64
      - name: Build PSX I_STAT contract
        run: cmake --build build/psx_interrupt_status --config Release --parallel 2
      - name: Test PSX I_STAT contract
        run: .\build\psx_interrupt_status\Release\jojo_psx_interrupt_status_tests.exe
      - name: Configure PSX SysDeqIntRP contract
        run: cmake -S tests/psx_sysdeqintpr -B build/psx_sysdeqintpr -G "Visual Studio 17 2022" -A x64
      - name: Build PSX SysDeqIntRP contract
        run: cmake --build build/psx_sysdeqintpr --config Release --parallel 2
      - name: Test PSX SysDeqIntRP contract
        run: .\build\psx_sysdeqintpr\Release\jojo_psx_sysdeqintpr_tests.exe
      - name: Configure PSX DPCR contract
        run: cmake -S tests/psx_dma_control -B build/psx_dma_control -G "Visual Studio 17 2022" -A x64
      - name: Build PSX DPCR contract
        run: cmake --build build/psx_dma_control --config Release --parallel 2
      - name: Test PSX DPCR contract
        run: .\build\psx_dma_control\Release\jojo_psx_dma_control_tests.exe
      - name: Configure PSX Timer 1 mode contract
        run: cmake -S tests/psx_timer1_mode -B build/psx_timer1_mode -G "Visual Studio 17 2022" -A x64
      - name: Build PSX Timer 1 mode contract
        run: cmake --build build/psx_timer1_mode --config Release --parallel 2
      - name: Test PSX Timer 1 mode contract
        run: .\build\psx_timer1_mode\Release\jojo_psx_timer1_mode_tests.exe
      - name: Configure PSX InitCARD2 contract
        run: cmake -S tests/psx_card_init -B build/psx_card_init -G "Visual Studio 17 2022" -A x64
      - name: Build PSX InitCARD2 contract
        run: cmake --build build/psx_card_init --config Release --parallel 2
      - name: Test PSX InitCARD2 contract
        run: .\build\psx_card_init\Release\jojo_psx_card_init_tests.exe
      - name: Configure R3000A foundation contract
        run: cmake -S tests/psx_r3000a_foundation -B build/psx_r3000a_foundation -G "Visual Studio 17 2022" -A x64
      - name: Build R3000A foundation contract
        run: cmake --build build/psx_r3000a_foundation --config Release --parallel 2
      - name: Test R3000A foundation contract
        run: .\build\psx_r3000a_foundation\Release\jojo_psx_r3000a_foundation_tests.exe
      - name: Configure R3000A frontier contract
        run: cmake -S tests/psx_r3000a_frontier -B build/psx_r3000a_frontier -G "Visual Studio 17 2022" -A x64
      - name: Build R3000A frontier contract
        run: cmake --build build/psx_r3000a_frontier --config Release --parallel 2
      - name: Test R3000A frontier contract
        run: .\build\psx_r3000a_frontier\Release\jojo_psx_r3000a_frontier_tests.exe
      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-Recompiled-Windows-x64
          path: build/Release/JOJO-Recompiled.exe
          if-no-files-found: error
