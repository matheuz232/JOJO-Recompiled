name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[r2.5-targeted]')
    name: Portable core / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Production readiness gate
        run: |
          cmake -DJOJO_SOURCE_DIR=${{ github.workspace }} -P cmake/CheckProductionReadiness.cmake
          cmake -DJOJO_SOURCE_DIR=${{ github.workspace }} -P cmake/CheckProductionReadinessNegative.cmake
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-x64:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[r2.5-targeted]')
    name: Windows x64 / MSVC 2022
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Production readiness gate
        run: |
          cmake -DJOJO_SOURCE_DIR=${{ github.workspace }} -P cmake/CheckProductionReadiness.cmake
          cmake -DJOJO_SOURCE_DIR=${{ github.workspace }} -P cmake/CheckProductionReadinessNegative.cmake
      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: JOJO-Recompiled-Windows-x64
          path: build/Release/JOJO-Recompiled.exe
          if-no-files-found: error
