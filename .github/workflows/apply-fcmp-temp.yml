name: apply-fcmp-temp

on:
  push:
    branches: [feature/sh4-fpu-compare]
    paths: [.github/workflows/apply-fcmp-temp.yml]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal FCMP implementation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace("src/core/sh4_decoder.h",
                  "    fdiv,\n    fmov_reg,",
                  "    fdiv,\n    fcmp_eq,\n    fcmp_gt,\n    fmov_reg,")

          replace("src/core/sh4_decoder.cpp",
                  "        i.rm = m_field(raw);\n        return i;\n    }\n    if ((raw & 0xF00Fu) == 0xF00Cu) {\n        i.op = Sh4Op::fmov_reg;",
                  "        i.rm = m_field(raw);\n        return i;\n    }\n    if (fpu_binary_code == 0xF004u || fpu_binary_code == 0xF005u) {\n        i.op = fpu_binary_code == 0xF004u ? Sh4Op::fcmp_eq : Sh4Op::fcmp_gt;\n        i.rn = n_field(raw);\n        i.rm = m_field(raw);\n        return i;\n    }\n    if ((raw & 0xF00Fu) == 0xF00Cu) {\n        i.op = Sh4Op::fmov_reg;")

          replace("src/core/sh4_ir.h",
                  "    divide_single_float,\n    copy_fpu_registers,",
                  "    divide_single_float,\n    compare_single_float_eq,\n    compare_single_float_gt,\n    copy_fpu_registers,")

          replace("src/core/sh4_ir.cpp",
                  "        case Sh4Op::fdiv: out.op = Sh4IrOp::divide_single_float; break;\n        case Sh4Op::fmov_reg:",
                  "        case Sh4Op::fdiv: out.op = Sh4IrOp::divide_single_float; break;\n        case Sh4Op::fcmp_eq: out.op = Sh4IrOp::compare_single_float_eq; break;\n        case Sh4Op::fcmp_gt: out.op = Sh4IrOp::compare_single_float_gt; break;\n        case Sh4Op::fmov_reg:")

          replace("src/core/sh4_reference_executor.cpp",
                  "    return Result<float>::success(value);\n}\n\nResult<std::uint32_t> calculate_single_binary",
                  "    return Result<float>::success(value);\n}\n\nResult<float> read_single_compare_operand(const Sh4ReferenceState& state,\n                                          std::uint32_t bits) {\n    if (is_single_subnormal(bits)) {\n        if ((state.fpscr & kFpscrDnBit) == 0u) {\n            return Result<float>::failure(\n                ErrorCode::unsupported_format,\n                \"reference FPU compare with DN=0 subnormal operands is not implemented\");\n        }\n        return Result<float>::success(std::bit_cast<float>(bits & 0x80000000u));\n    }\n    const auto value = std::bit_cast<float>(bits);\n    if (std::isnan(value)) {\n        return Result<float>::failure(\n            ErrorCode::unsupported_format,\n            \"reference FPU compare NaN exception flags are not implemented\");\n    }\n    return Result<float>::success(value);\n}\n\nResult<std::uint32_t> calculate_single_binary")

          replace("src/core/sh4_reference_executor.cpp",
                  "            state.fr[instruction.dst_reg] = result.value;\n            return Result<void>::success();\n        }\n        case Sh4IrOp::copy_fpu_registers: {",
                  "            state.fr[instruction.dst_reg] = result.value;\n            return Result<void>::success();\n        }\n        case Sh4IrOp::compare_single_float_eq:\n        case Sh4IrOp::compare_single_float_gt: {\n            auto dst = require_register(instruction.dst_reg);\n            if (!dst) return dst;\n            auto src = require_register(instruction.src_reg);\n            if (!src) return src;\n            if ((state.fpscr & kFpscrPrBit) != 0u) {\n                return Result<void>::failure(\n                    ErrorCode::unsupported_format,\n                    \"reference FPU double-precision compare is not implemented\");\n            }\n            auto destination = read_single_compare_operand(state, state.fr[instruction.dst_reg]);\n            if (!destination) return Result<void>::failure(destination.error, destination.detail);\n            auto source = read_single_compare_operand(state, state.fr[instruction.src_reg]);\n            if (!source) return Result<void>::failure(source.error, source.detail);\n            state.t = instruction.op == Sh4IrOp::compare_single_float_eq\n                ? destination.value == source.value\n                : destination.value > source.value;\n            return Result<void>::success();\n        }\n        case Sh4IrOp::copy_fpu_registers: {")
      - name: Check diff
        run: git diff --check && git diff -- src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.cpp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit implementation
        run: |
          git config user.name "matheuz232"
          git config user.email "82462256+matheuz232@users.noreply.github.com"
          git add src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.cpp
          git commit -m "SH-4: add single-precision FPU comparisons"
          git push origin HEAD:feature/sh4-fpu-compare
