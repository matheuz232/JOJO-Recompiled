name: agent-gpu-irq-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-gpu-irq-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow GPU IRQ1 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/psx_bus.h')
          text = path.read_text()
          old = (
              '        case 0x1fu:\n'
              '            bus.gpu_status |= 1u << 24u;\n'
              '            return;\n'
          )
          new = (
              '        case 0x1fu: {\n'
              '            const bool was_requested = (bus.gpu_status & (1u << 24u)) != 0u;\n'
              '            bus.gpu_status |= 1u << 24u;\n'
              '            if (!was_requested) {\n'
              '                bus.interrupt_status = static_cast<std::uint16_t>(\n'
              '                    bus.interrupt_status | (1u << 1u));\n'
              '            }\n'
              '            return;\n'
              '        }\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one GP0(1Fh) site, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/core/psx_bus.h
      - name: Build GPU/DMA contract
        shell: bash
        run: |
          cmake -S tests/psx_dma_control -B build/psx_dma_control -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psx_dma_control --parallel 2
      - name: Run GPU/DMA contract
        shell: bash
        run: ./build/psx_dma_control/jojo_psx_dma_control_tests
      - name: Commit GPU IRQ1 integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/psx_bus.h
          git commit -m 'feat: deliver PS1 GPU IRQ1 rising edges'
          git push origin HEAD:feature/offline-product-rebuild
