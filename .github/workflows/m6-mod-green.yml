name: m6-mod-green

on:
  push:
    branches: [feature/m6-mod-runtime]
    paths:
      - 'src/core/mod_runtime.h'
      - 'src/core/mod_runtime.cpp'
      - 'tests/test_mod_runtime.cpp'
      - '.github/workflows/m6-mod-green.yml'

jobs:
  manifest-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manifest test
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc tests/test_mod_runtime.cpp src/core/mod_runtime.cpp src/core/semver.cpp -o /tmp/test_mod_runtime
      - name: Run manifest test
        run: /tmp/test_mod_runtime
