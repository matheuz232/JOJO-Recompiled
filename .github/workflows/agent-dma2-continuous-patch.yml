name: agent-dma2-continuous-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-dma2-continuous-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow DMA2 continuous integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/psx_bus.h')
          text = path.read_text()
          old = (
              '    if (address == PsxBus::dma2_channel_control_address) {\n'
              '        constexpr std::uint32_t linked_list_ram_to_gpu = 0x01000401u;\n'
              '        if (value == linked_list_ram_to_gpu) {\n'
          )
          new = (
              '    if (address == PsxBus::dma2_channel_control_address) {\n'
              '        constexpr std::uint32_t sync1_gpu_to_ram = 0x01000200u;\n'
              '        constexpr std::uint32_t sync1_ram_to_gpu = 0x01000201u;\n'
              '        constexpr std::uint32_t linked_list_ram_to_gpu = 0x01000401u;\n'
              '        if (value == sync1_gpu_to_ram || value == sync1_ram_to_gpu) {\n'
              '            const bool ram_to_gpu = value == sync1_ram_to_gpu;\n'
              '            const auto gpu_dma_direction = (bus.gpu_status >> 29u) & 3u;\n'
              '            if ((ram_to_gpu && gpu_dma_direction != 2u) ||\n'
              '                (!ram_to_gpu && gpu_dma_direction != 3u)) {\n'
              '                return PsxBusAccessReason::unmapped;\n'
              '            }\n'
              '\n'
              '            const auto raw_block_words = bus.dma2_block_control & 0xffffu;\n'
              '            const auto raw_block_count = bus.dma2_block_control >> 16u;\n'
              '            const auto block_words = raw_block_words == 0u ? 0x10000u : raw_block_words;\n'
              '            const auto block_count = raw_block_count == 0u ? 0x10000u : raw_block_count;\n'
              '            const auto word_count =\n'
              '                static_cast<std::uint64_t>(block_words) * block_count;\n'
              '            if (word_count == 0u || word_count > PsxBus::main_ram_size / 4u) {\n'
              '                return PsxBusAccessReason::unmapped;\n'
              '            }\n'
              '\n'
              '            if (!ram_to_gpu) {\n'
              '                if (!psx_gpu_vram_to_cpu_active(bus)) return PsxBusAccessReason::unmapped;\n'
              '                const auto dimensions = bus.gpu_gp0_packet[1];\n'
              '                const auto total_pixels =\n'
              '                    (dimensions & 0xffffu) * (dimensions >> 16u);\n'
              '                const auto pixels_read = bus.gpu_gp0_packet[2];\n'
              '                if (pixels_read > total_pixels) return PsxBusAccessReason::unmapped;\n'
              '                const auto remaining_words =\n'
              '                    (static_cast<std::uint64_t>(total_pixels - pixels_read) + 1u) / 2u;\n'
              '                if (word_count > remaining_words) return PsxBusAccessReason::unmapped;\n'
              '            }\n'
              '\n'
              '            auto memory_address = bus.dma2_base & 0x00fffffcu;\n'
              '            for (std::uint64_t word = 0u; word < word_count; ++word) {\n'
              '                const auto offset = static_cast<std::size_t>(\n'
              '                    memory_address & (PsxBus::main_ram_size - 1u));\n'
              '                if (ram_to_gpu) {\n'
              '                    const auto gp0 = static_cast<std::uint32_t>(bus.ram[offset + 0u]) |\n'
              '                                     (static_cast<std::uint32_t>(bus.ram[offset + 1u]) << 8u) |\n'
              '                                     (static_cast<std::uint32_t>(bus.ram[offset + 2u]) << 16u) |\n'
              '                                     (static_cast<std::uint32_t>(bus.ram[offset + 3u]) << 24u);\n'
              '                    psx_gpu_write_gp0(bus, gp0);\n'
              '                } else {\n'
              '                    const auto gpu_word = psx_bus_read_u32(bus, PsxBus::gpu_gp0_address);\n'
              '                    if (gpu_word.reason != PsxBusAccessReason::ok) return gpu_word.reason;\n'
              '                    bus.ram[offset + 0u] = static_cast<std::uint8_t>(gpu_word.value);\n'
              '                    bus.ram[offset + 1u] = static_cast<std::uint8_t>(gpu_word.value >> 8u);\n'
              '                    bus.ram[offset + 2u] = static_cast<std::uint8_t>(gpu_word.value >> 16u);\n'
              '                    bus.ram[offset + 3u] = static_cast<std::uint8_t>(gpu_word.value >> 24u);\n'
              '                }\n'
              '                memory_address = (memory_address + 4u) & 0x00ffffffu;\n'
              '            }\n'
              '\n'
              '            bus.dma2_base = memory_address;\n'
              '            bus.dma2_block_control = raw_block_words;\n'
              '            bus.dma2_channel_control = value & ~PsxBus::dma_channel_start_busy;\n'
              '            const bool previous_master =\n'
              '                (psx_bus_dma_interrupt_value(bus) & PsxBus::dma_interrupt_master_flag) != 0u;\n'
              '            bus.dma_interrupt |= 1u << 26u;\n'
              '            const bool current_master =\n'
              '                (psx_bus_dma_interrupt_value(bus) & PsxBus::dma_interrupt_master_flag) != 0u;\n'
              '            if (!previous_master && current_master) {\n'
              '                bus.interrupt_status = static_cast<std::uint16_t>(\n'
              '                    bus.interrupt_status | (1u << 3u));\n'
              '            }\n'
              '            return PsxBusAccessReason::ok;\n'
              '        }\n'
              '        if (value == linked_list_ram_to_gpu) {\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one DMA2 insertion point, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/core/psx_bus.h
      - name: Build GPU/DMA contract
        shell: bash
        run: |
          cmake -S tests/psx_dma_control -B build/psx_dma_control -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psx_dma_control --parallel 2
      - name: Run GPU/DMA contract
        shell: bash
        run: ./build/psx_dma_control/jojo_psx_dma_control_tests
      - name: Commit DMA2 continuous integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/psx_bus.h
          git commit -m 'feat: implement PS1 DMA2 continuous GPU transfers'
          git push origin HEAD:feature/offline-product-rebuild
