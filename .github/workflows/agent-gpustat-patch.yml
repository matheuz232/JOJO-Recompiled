name: agent-gpustat-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-gpustat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow GPUSTAT integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/psx_dma_control/main.cpp')
          test_text = test_path.read_text()
          old_test = (
              '    CHECK((gpu_cpu_to_gp0.value & 0x1fffffffu) ==\n'
              '          (reset_status.value & 0x1fffffffu));\n'
          )
          new_test = (
              '    CHECK((gpu_cpu_to_gp0.value & 0x1dffffffu) ==\n'
              '          (reset_status.value & 0x1dffffffu));\n'
              '    CHECK((gpu_cpu_to_gp0.value & (1u << 25u)) != 0u);\n'
          )
          if test_text.count(old_test) != 1:
              raise SystemExit('expected one legacy GPU DMA status assertion')
          test_path.write_text(test_text.replace(old_test, new_test, 1))

          bus_path = Path('src/core/psx_bus.h')
          bus_text = bus_path.read_text()
          marker = (
              '[[nodiscard]] inline PsxBusReadU32Result psx_bus_read_u32(const PsxBus& bus,\n'
              '                                                           std::uint32_t address) noexcept {\n'
          )
          helper = (
              '[[nodiscard]] inline std::uint32_t psx_gpu_status_value(const PsxBus& bus) noexcept {\n'
              '    constexpr std::uint32_t data_request = 1u << 25u;\n'
              '    constexpr std::uint32_t ready_command = 1u << 26u;\n'
              '    constexpr std::uint32_t ready_vram_to_cpu = 1u << 27u;\n'
              '    constexpr std::uint32_t ready_dma_block = 1u << 28u;\n'
              '\n'
              '    auto value = bus.gpu_status & ~data_request;\n'
              '    const bool command_ready =\n'
              '        bus.gpu_gp0_packet_count == 0u && !bus.gpu_polyline_active;\n'
              '    if (command_ready) value |= ready_command;\n'
              '    else value &= ~ready_command;\n'
              '\n'
              '    bool dma_block_ready = true;\n'
              '    if (psx_gpu_vram_to_cpu_active(bus) || bus.gpu_polyline_active) {\n'
              '        dma_block_ready = false;\n'
              '    } else if (bus.gpu_gp0_packet_count != 0u &&\n'
              '               bus.gpu_gp0_packet_count < 0xfeu) {\n'
              '        const auto group = bus.gpu_gp0_packet[0] >> 29u;\n'
              '        if (group == 1u || group == 2u) dma_block_ready = false;\n'
              '    }\n'
              '    if (dma_block_ready) value |= ready_dma_block;\n'
              '    else value &= ~ready_dma_block;\n'
              '\n'
              '    bool request = false;\n'
              '    switch ((value >> 29u) & 3u) {\n'
              '    case 0u: request = false; break;\n'
              '    case 1u: request = true; break;\n'
              '    case 2u: request = dma_block_ready; break;\n'
              '    default: request = (value & ready_vram_to_cpu) != 0u; break;\n'
              '    }\n'
              '    if (request) value |= data_request;\n'
              '    return value;\n'
              '}\n'
              '\n'
          )
          if bus_text.count(marker) != 1:
              raise SystemExit('expected one PSX u32 read entry point')
          bus_text = bus_text.replace(marker, helper + marker, 1)
          old_read = (
              '    if (address == PsxBus::gpu_gp1_address) return {PsxBusAccessReason::ok, bus.gpu_status};\n'
          )
          new_read = (
              '    if (address == PsxBus::gpu_gp1_address) {\n'
              '        return {PsxBusAccessReason::ok, psx_gpu_status_value(bus)};\n'
              '    }\n'
          )
          if bus_text.count(old_read) != 1:
              raise SystemExit('expected one GPUSTAT read site')
          bus_path.write_text(bus_text.replace(old_read, new_read, 1))
          PY
          git diff --check
          git diff -- tests/psx_dma_control/main.cpp src/core/psx_bus.h
      - name: Build GPU/DMA contract
        shell: bash
        run: |
          cmake -S tests/psx_dma_control -B build/psx_dma_control -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psx_dma_control --parallel 2
      - name: Run GPU/DMA contract
        shell: bash
        run: ./build/psx_dma_control/jojo_psx_dma_control_tests
      - name: Commit GPUSTAT integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/psx_dma_control/main.cpp src/core/psx_bus.h
          git commit -m 'feat: model PS1 GPUSTAT ready and DMA request bits'
          git push origin HEAD:feature/offline-product-rebuild
