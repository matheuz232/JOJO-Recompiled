name: m7-red

on:
  push:
    branches: [feature/m7-training-lab]

permissions:
  contents: read

jobs:
  red-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile permanent M7 test contract
        run: g++ -std=c++20 -Isrc -fsyntax-only tests/test_training.cpp

  red-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile permanent M7 test contract
        shell: cmd
        run: cl /nologo /std:c++20 /EHsc /Isrc /c tests\test_training.cpp
