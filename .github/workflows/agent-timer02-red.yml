name: agent-timer02-foundation-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-timer02-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply root-counter foundation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/psx_bus.h')
          text = path.read_text()

          replacements = []
          replacements.append((
              '    static constexpr std::uint32_t timer1_current_address = 0x1f801110u;\n'
              '    static constexpr std::uint32_t timer1_mode_address = 0x1f801114u;\n',
              '    static constexpr std::uint32_t timer0_current_address = 0x1f801100u;\n'
              '    static constexpr std::uint32_t timer0_mode_address = 0x1f801104u;\n'
              '    static constexpr std::uint32_t timer0_target_address = 0x1f801108u;\n'
              '    static constexpr std::uint32_t timer1_current_address = 0x1f801110u;\n'
              '    static constexpr std::uint32_t timer1_mode_address = 0x1f801114u;\n'
              '    static constexpr std::uint32_t timer1_target_address = 0x1f801118u;\n'
              '    static constexpr std::uint32_t timer2_current_address = 0x1f801120u;\n'
              '    static constexpr std::uint32_t timer2_mode_address = 0x1f801124u;\n'
              '    static constexpr std::uint32_t timer2_target_address = 0x1f801128u;\n'))
          replacements.append((
              '    std::uint16_t timer1_current{};\n'
              '    std::uint16_t timer1_mode{};\n'
              '    std::uint64_t video_clock_phase{};\n',
              '    std::uint16_t timer0_current{};\n'
              '    std::uint16_t timer0_mode{};\n'
              '    std::uint16_t timer0_target{};\n'
              '    std::uint16_t timer1_current{};\n'
              '    std::uint16_t timer1_mode{};\n'
              '    std::uint16_t timer1_target{};\n'
              '    std::uint16_t timer2_current{};\n'
              '    std::uint16_t timer2_mode{};\n'
              '    std::uint16_t timer2_target{};\n'
              '    std::uint8_t timer2_clock_phase{};\n'
              '    std::uint64_t video_clock_phase{};\n'))
          replacements.append((
              '    if (address == PsxBus::timer1_current_address) return {PsxBusAccessReason::ok, bus.timer1_current};\n'
              '    if (address == PsxBus::timer1_mode_address) {\n'
              '        return {PsxBusAccessReason::ok,\n'
              '                static_cast<std::uint16_t>(bus.timer1_mode & PsxBus::timer_mode_guest_bits)};\n'
              '    }\n',
              '    if (address == PsxBus::timer0_current_address) return {PsxBusAccessReason::ok, bus.timer0_current};\n'
              '    if (address == PsxBus::timer0_mode_address) return {PsxBusAccessReason::ok, static_cast<std::uint16_t>(bus.timer0_mode & PsxBus::timer_mode_guest_bits)};\n'
              '    if (address == PsxBus::timer0_target_address) return {PsxBusAccessReason::ok, bus.timer0_target};\n'
              '    if (address == PsxBus::timer1_current_address) return {PsxBusAccessReason::ok, bus.timer1_current};\n'
              '    if (address == PsxBus::timer1_mode_address) return {PsxBusAccessReason::ok, static_cast<std::uint16_t>(bus.timer1_mode & PsxBus::timer_mode_guest_bits)};\n'
              '    if (address == PsxBus::timer1_target_address) return {PsxBusAccessReason::ok, bus.timer1_target};\n'
              '    if (address == PsxBus::timer2_current_address) return {PsxBusAccessReason::ok, bus.timer2_current};\n'
              '    if (address == PsxBus::timer2_mode_address) return {PsxBusAccessReason::ok, static_cast<std::uint16_t>(bus.timer2_mode & PsxBus::timer_mode_guest_bits)};\n'
              '    if (address == PsxBus::timer2_target_address) return {PsxBusAccessReason::ok, bus.timer2_target};\n'))
          replacements.append((
              '    if (address == PsxBus::timer1_current_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer1_current)};\n',
              '    if (address == PsxBus::timer0_current_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer0_current)};\n'
              '    if (address == PsxBus::timer0_mode_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer0_mode & PsxBus::timer_mode_guest_bits)};\n'
              '    if (address == PsxBus::timer0_target_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer0_target)};\n'
              '    if (address == PsxBus::timer1_current_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer1_current)};\n'
              '    if (address == PsxBus::timer1_mode_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer1_mode & PsxBus::timer_mode_guest_bits)};\n'
              '    if (address == PsxBus::timer1_target_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer1_target)};\n'
              '    if (address == PsxBus::timer2_current_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer2_current)};\n'
              '    if (address == PsxBus::timer2_mode_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer2_mode & PsxBus::timer_mode_guest_bits)};\n'
              '    if (address == PsxBus::timer2_target_address) return {PsxBusAccessReason::ok, static_cast<std::uint32_t>(bus.timer2_target)};\n'))
          replacements.append((
              '    if (address == PsxBus::timer1_current_address) { bus.timer1_current = value; return PsxBusAccessReason::ok; }\n'
              '    if (address == PsxBus::timer1_mode_address) {\n'
              '        const auto next_epoch = static_cast<std::uint16_t>((bus.timer1_mode ^ PsxBus::timer_mode_write_epoch) & PsxBus::timer_mode_write_epoch);\n'
              '        bus.timer1_mode = static_cast<std::uint16_t>((value & PsxBus::timer_mode_guest_bits) | next_epoch);\n'
              '        bus.timer1_current = 0u;\n'
              '        return PsxBusAccessReason::ok;\n'
              '    }\n',
              '    if (address == PsxBus::timer0_current_address) { bus.timer0_current = value; return PsxBusAccessReason::ok; }\n'
              '    if (address == PsxBus::timer0_mode_address) {\n'
              '        const auto next_epoch = static_cast<std::uint16_t>((bus.timer0_mode ^ PsxBus::timer_mode_write_epoch) & PsxBus::timer_mode_write_epoch);\n'
              '        bus.timer0_mode = static_cast<std::uint16_t>((value & PsxBus::timer_mode_guest_bits) | next_epoch);\n'
              '        bus.timer0_current = 0u;\n'
              '        return PsxBusAccessReason::ok;\n'
              '    }\n'
              '    if (address == PsxBus::timer0_target_address) { bus.timer0_target = value; return PsxBusAccessReason::ok; }\n'
              '    if (address == PsxBus::timer1_current_address) { bus.timer1_current = value; return PsxBusAccessReason::ok; }\n'
              '    if (address == PsxBus::timer1_mode_address) {\n'
              '        const auto next_epoch = static_cast<std::uint16_t>((bus.timer1_mode ^ PsxBus::timer_mode_write_epoch) & PsxBus::timer_mode_write_epoch);\n'
              '        bus.timer1_mode = static_cast<std::uint16_t>((value & PsxBus::timer_mode_guest_bits) | next_epoch);\n'
              '        bus.timer1_current = 0u;\n'
              '        return PsxBusAccessReason::ok;\n'
              '    }\n'
              '    if (address == PsxBus::timer1_target_address) { bus.timer1_target = value; return PsxBusAccessReason::ok; }\n'
              '    if (address == PsxBus::timer2_current_address) { bus.timer2_current = value; return PsxBusAccessReason::ok; }\n'
              '    if (address == PsxBus::timer2_mode_address) {\n'
              '        const auto next_epoch = static_cast<std::uint16_t>((bus.timer2_mode ^ PsxBus::timer_mode_write_epoch) & PsxBus::timer_mode_write_epoch);\n'
              '        bus.timer2_mode = static_cast<std::uint16_t>((value & PsxBus::timer_mode_guest_bits) | next_epoch);\n'
              '        bus.timer2_current = 0u;\n'
              '        bus.timer2_clock_phase = 0u;\n'
              '        return PsxBusAccessReason::ok;\n'
              '    }\n'
              '    if (address == PsxBus::timer2_target_address) { bus.timer2_target = value; return PsxBusAccessReason::ok; }\n'))
          replacements.append((
              '    if (address == PsxBus::timer1_mode_address) return psx_bus_write_u16(bus, address, static_cast<std::uint16_t>(value));\n',
              '    if (address == PsxBus::timer0_current_address || address == PsxBus::timer0_mode_address || address == PsxBus::timer0_target_address ||\n'
              '        address == PsxBus::timer1_current_address || address == PsxBus::timer1_mode_address || address == PsxBus::timer1_target_address ||\n'
              '        address == PsxBus::timer2_current_address || address == PsxBus::timer2_mode_address || address == PsxBus::timer2_target_address) {\n'
              '        return psx_bus_write_u16(bus, address, static_cast<std::uint16_t>(value));\n'
              '    }\n'))
          replacements.append((
              'inline void psx_bus_tick(PsxBus& bus, std::uint32_t cpu_cycles) noexcept {\n'
              '    constexpr std::uint16_t timer1_hblank_clock = 1u << 8u;\n',
              'inline void psx_bus_tick(PsxBus& bus, std::uint32_t cpu_cycles) noexcept {\n'
              '    constexpr std::uint16_t synchronization_enable = 1u << 0u;\n'
              '    constexpr std::uint16_t timer1_hblank_clock = 1u << 8u;\n'
              '    if ((bus.timer0_mode & synchronization_enable) == 0u) {\n'
              '        const auto source = static_cast<std::uint16_t>((bus.timer0_mode >> 8u) & 3u);\n'
              '        if (source == 0u || source == 2u) {\n'
              '            bus.timer0_current = static_cast<std::uint16_t>(bus.timer0_current + cpu_cycles);\n'
              '        }\n'
              '    }\n'
              '    if ((bus.timer1_mode & synchronization_enable) == 0u) {\n'
              '        const auto source = static_cast<std::uint16_t>((bus.timer1_mode >> 8u) & 3u);\n'
              '        if (source == 0u || source == 2u) {\n'
              '            bus.timer1_current = static_cast<std::uint16_t>(bus.timer1_current + cpu_cycles);\n'
              '        }\n'
              '    }\n'
              '    if ((bus.timer2_mode & synchronization_enable) == 0u) {\n'
              '        const auto source = static_cast<std::uint16_t>((bus.timer2_mode >> 8u) & 3u);\n'
              '        if (source == 0u || source == 1u) {\n'
              '            bus.timer2_current = static_cast<std::uint16_t>(bus.timer2_current + cpu_cycles);\n'
              '        } else {\n'
              '            const auto total = static_cast<std::uint64_t>(bus.timer2_clock_phase) + cpu_cycles;\n'
              '            bus.timer2_current = static_cast<std::uint16_t>(bus.timer2_current + total / 8u);\n'
              '            bus.timer2_clock_phase = static_cast<std::uint8_t>(total % 8u);\n'
              '        }\n'
              '    }\n'))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement site, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/core/psx_bus.h
      - name: Configure timer contract
        run: cmake -S tests/psx_timer1_mode -B build/psx_timer1_mode -DCMAKE_BUILD_TYPE=Release
      - name: Build timer contract
        run: cmake --build build/psx_timer1_mode --parallel 2
      - name: Run timer contract
        run: ./build/psx_timer1_mode/jojo_psx_timer1_mode_tests
      - name: Commit root-counter foundation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/psx_bus.h
          git commit -m 'feat: implement PS1 root-counter foundation'
          git push origin HEAD:feature/offline-product-rebuild
