name: apply-float-ftrc-temp
on:
  push:
    branches:
      - feature/sh4-float-ftrc
    paths:
      - .github/workflows/apply-float-ftrc-temp.yml
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sh4-float-ftrc
          fetch-depth: 0
      - name: Apply minimal FLOAT/FTRC implementation
        run: python .github/scripts/apply_float_ftrc.py
      - name: Check diff
        run: git diff --check
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Focused test
        run: ctest --test-dir build -R jojo_sh4_float_ftrc_tests --output-on-failure
      - name: Full tests
        run: ctest --test-dir build --output-on-failure
      - name: Commit implementation
        run: |
          git config user.name matheuz232
          git config user.email 82462256+matheuz232@users.noreply.github.com
          git add src/core/sh4_decoder.h src/core/sh4_decoder.cpp src/core/sh4_ir.h src/core/sh4_ir.cpp src/core/sh4_reference_executor.cpp
          git commit -m "SH-4: add single-precision FLOAT and FTRC"
          git push origin HEAD:feature/sh4-float-ftrc
