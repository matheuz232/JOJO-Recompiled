name: agent-timer-mode-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-timer-mode-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply timer MODE status integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/psx_bus.h')
          text = path.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          one(
              '    static constexpr std::uint16_t timer_mode_guest_bits = 0x1fffu;\n'
              '    static constexpr std::uint16_t timer_mode_write_epoch = 0x8000u;\n',
              '    static constexpr std::uint16_t timer_mode_guest_bits = 0x1fffu;\n'
              '    static constexpr std::uint16_t timer_mode_control_bits = 0x03ffu;\n'
              '    static constexpr std::uint16_t timer_mode_interrupt_request = 1u << 10u;\n'
              '    static constexpr std::uint16_t timer_mode_reached_target = 1u << 11u;\n'
              '    static constexpr std::uint16_t timer_mode_reached_ffff = 1u << 12u;\n'
              '    static constexpr std::uint16_t timer_mode_read_clear_bits =\n'
              '        timer_mode_reached_target | timer_mode_reached_ffff;\n'
              '    static constexpr std::uint16_t timer_mode_write_epoch = 0x8000u;\n',
              'timer mode constants')

          old_write = '(value & PsxBus::timer_mode_guest_bits) | next_epoch'
          new_write = '(value & PsxBus::timer_mode_control_bits) | PsxBus::timer_mode_interrupt_request | next_epoch'
          count = text.count(old_write)
          if count != 3:
              raise SystemExit(f'mode writes: expected 3 matches, found {count}')
          text = text.replace(old_write, new_write)

          one(
              '                                              std::uint16_t mode,\n'
              '                                              std::uint16_t target,\n',
              '                                              std::uint16_t& mode,\n'
              '                                              std::uint16_t target,\n',
              'root counter mode reference')

          one(
              '        const bool hit_target = current == target;\n'
              '        const bool hit_ffff = current == 0xffffu;\n'
              '        const bool irq_enabled =\n',
              '        const bool hit_target = current == target;\n'
              '        const bool hit_ffff = current == 0xffffu;\n'
              '        if (hit_target) mode = static_cast<std::uint16_t>(mode | PsxBus::timer_mode_reached_target);\n'
              '        if (hit_ffff) mode = static_cast<std::uint16_t>(mode | PsxBus::timer_mode_reached_ffff);\n'
              '        const bool irq_enabled =\n',
              'root counter status latches')

          overload = '\n'.join([
              '[[nodiscard]] inline PsxBusReadU16Result psx_bus_read_u16(PsxBus& bus,',
              '                                                           std::uint32_t address) noexcept {',
              '    const auto read_mode = [](std::uint16_t& mode) noexcept -> PsxBusReadU16Result {',
              '        const auto value = static_cast<std::uint16_t>(mode & PsxBus::timer_mode_guest_bits);',
              '        mode = static_cast<std::uint16_t>(mode & ~PsxBus::timer_mode_read_clear_bits);',
              '        return {PsxBusAccessReason::ok, value};',
              '    };',
              '    if (address == PsxBus::timer0_mode_address) return read_mode(bus.timer0_mode);',
              '    if (address == PsxBus::timer1_mode_address) return read_mode(bus.timer1_mode);',
              '    if (address == PsxBus::timer2_mode_address) return read_mode(bus.timer2_mode);',
              '    return psx_bus_read_u16(static_cast<const PsxBus&>(bus), address);',
              '}',
              '',
          ])
          anchor = '[[nodiscard]] inline std::uint32_t psx_gpu_status_value(const PsxBus& bus) noexcept {\n'
          one(anchor, overload + anchor, 'mutable timer mode read overload')

          one(
              '[[nodiscard]] inline PsxBusReadU32Result psx_bus_read_u32(PsxBus& bus,\n'
              '                                                           std::uint32_t address) noexcept {\n'
              '    if ((address & 3u) != 0u) return {PsxBusAccessReason::misaligned, 0u};\n'
              '    if (address == PsxBus::gpu_gp0_address && psx_gpu_vram_to_cpu_active(bus)) {\n',
              '[[nodiscard]] inline PsxBusReadU32Result psx_bus_read_u32(PsxBus& bus,\n'
              '                                                           std::uint32_t address) noexcept {\n'
              '    if ((address & 3u) != 0u) return {PsxBusAccessReason::misaligned, 0u};\n'
              '    if (address == PsxBus::timer0_mode_address ||\n'
              '        address == PsxBus::timer1_mode_address ||\n'
              '        address == PsxBus::timer2_mode_address) {\n'
              '        const auto mode = psx_bus_read_u16(bus, address);\n'
              '        return {mode.reason, static_cast<std::uint32_t>(mode.value)};\n'
              '    }\n'
              '    if (address == PsxBus::gpu_gp0_address && psx_gpu_vram_to_cpu_active(bus)) {\n',
              'mutable 32-bit timer mode read')

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/core/psx_bus.h
      - name: Configure timer contract
        run: cmake -S tests/psx_timer1_mode -B build/psx_timer1_mode -DCMAKE_BUILD_TYPE=Release
      - name: Build timer contract
        run: cmake --build build/psx_timer1_mode --parallel 2
      - name: Run timer contract
        run: ./build/psx_timer1_mode/jojo_psx_timer1_mode_tests
      - name: Commit timer MODE status integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/psx_bus.h
          git commit -m 'feat: implement PS1 root-counter mode status flags'
          git push origin HEAD:feature/offline-product-rebuild
