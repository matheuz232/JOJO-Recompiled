name: m6-mod-red

on:
  push:
    branches: [feature/m6-mod-runtime]
    paths:
      - 'tests/test_mod_runtime.cpp'
      - 'src/core/mod_runtime.h'
      - 'src/core/mod_runtime.cpp'
      - '.github/workflows/m6-mod-red.yml'

jobs:
  manifest-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile manifest RED
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc -c tests/test_mod_runtime.cpp -o /tmp/test_mod_runtime.o
