name: Apply FSCA FSRRA GREEN
on:
  push:
    branches:
      - feature/sh4-cpu-fpu-completion
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_fsca_fsrra_green.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete FSCA FSRRA exception semantics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
