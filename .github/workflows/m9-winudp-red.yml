name: m9-winudp-red

on:
  push:
    branches:
      - feature/m9-online-product-modes

jobs:
  red:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile WinSock UDP contract
        shell: cmd
        run: '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 && cl /nologo /std:c++20 /EHsc /Isrc /c tests\test_win32_udp_transport.cpp'
