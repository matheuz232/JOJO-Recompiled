name: agent-fix-sh4-sgr

on:
  push:
    branches:
      - feature/sh4-cpu-system-completion
    paths:
      - .github/workflows/agent-fix-sh4-sgr.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Implement SGR load forms
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/core/sh4_decoder.h',
              '    ldc_spc_reg,\n    ldc_dbr_reg,\n',
              '    ldc_spc_reg,\n    ldc_sgr_reg,\n    ldc_dbr_reg,\n')
          replace_once(
              'src/core/sh4_decoder.h',
              '    ldc_spc_postinc,\n    ldc_dbr_postinc,\n',
              '    ldc_spc_postinc,\n    ldc_sgr_postinc,\n    ldc_dbr_postinc,\n')

          replace_once(
              'src/core/sh4_decoder.cpp',
              '    if (control_code == 0x404Eu) { i.op = Sh4Op::ldc_spc_reg; i.rm = n_field(raw); return i; }\n    if (control_code == 0x40FAu)',
              '    if (control_code == 0x404Eu) { i.op = Sh4Op::ldc_spc_reg; i.rm = n_field(raw); return i; }\n    if (control_code == 0x403Au) { i.op = Sh4Op::ldc_sgr_reg; i.rm = n_field(raw); return i; }\n    if (control_code == 0x40FAu)')
          replace_once(
              'src/core/sh4_decoder.cpp',
              '    if (control_code == 0x4047u) { i.op = Sh4Op::ldc_spc_postinc; i.rm = n_field(raw); return i; }\n    if (control_code == 0x40F6u)',
              '    if (control_code == 0x4047u) { i.op = Sh4Op::ldc_spc_postinc; i.rm = n_field(raw); return i; }\n    if (control_code == 0x4036u) { i.op = Sh4Op::ldc_sgr_postinc; i.rm = n_field(raw); return i; }\n    if (control_code == 0x40F6u)')

          replace_once(
              'src/core/sh4_ir.cpp',
              '        case Sh4Op::ldc_spc_reg: out.op = Sh4IrOp::set_control_from_reg; out.imm = 3; break;\n        case Sh4Op::ldc_dbr_reg:',
              '        case Sh4Op::ldc_spc_reg: out.op = Sh4IrOp::set_control_from_reg; out.imm = 3; break;\n        case Sh4Op::ldc_sgr_reg: out.op = Sh4IrOp::set_control_from_reg; out.imm = 4; break;\n        case Sh4Op::ldc_dbr_reg:')
          replace_once(
              'src/core/sh4_ir.cpp',
              '        case Sh4Op::ldc_spc_postinc: out.op = Sh4IrOp::load_control_postinc32; out.imm = 3; break;\n        case Sh4Op::ldc_dbr_postinc:',
              '        case Sh4Op::ldc_spc_postinc: out.op = Sh4IrOp::load_control_postinc32; out.imm = 3; break;\n        case Sh4Op::ldc_sgr_postinc: out.op = Sh4IrOp::load_control_postinc32; out.imm = 4; break;\n        case Sh4Op::ldc_dbr_postinc:')

          replace_once(
              'src/core/sh4_reference_executor.cpp',
              '        case 3: state.spc = value; break;\n        case 5: state.dbr = value; break;',
              '        case 3: state.spc = value; break;\n        case 4: state.sgr = value; break;\n        case 5: state.dbr = value; break;')
          PY
      - name: Commit implementation and remove workflow
        run: |
          rm .github/workflows/agent-fix-sh4-sgr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete SH-4 SGR load forms"
          git push origin HEAD:${GITHUB_REF_NAME}
