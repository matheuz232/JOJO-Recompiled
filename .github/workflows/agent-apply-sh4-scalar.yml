name: agent-apply-sh4-scalar

on:
  push:
    branches:
      - feature/sh4-cpu-scalar-completion
    paths:
      - .agent/apply_sh4_scalar.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scalar SH-4 implementation
        run: python3 .agent/apply_sh4_scalar.py
      - name: Commit implementation and remove applicator
        run: |
          rm .agent/apply_sh4_scalar.py .github/workflows/agent-apply-sh4-scalar.yml
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete scalar SH-4 instruction families"
          git push origin HEAD:${GITHUB_REF_NAME}
