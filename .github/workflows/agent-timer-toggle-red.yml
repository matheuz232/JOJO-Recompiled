name: agent-timer-toggle-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-timer-toggle-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply timer toggle semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/core/psx_bus.h')
          text = path.read_text()

          old_constants = '''    constexpr std::uint16_t irq_at_ffff = 1u << 5u;
              constexpr std::uint16_t repeat_irq = 1u << 6u;
          '''
          new_constants = '''    constexpr std::uint16_t irq_at_ffff = 1u << 5u;
              constexpr std::uint16_t repeat_irq = 1u << 6u;
              constexpr std::uint16_t toggle_irq = 1u << 7u;
          '''
          if old_constants not in text:
              old_constants = '''    constexpr std::uint16_t irq_at_ffff = 1u << 5u;
    constexpr std::uint16_t repeat_irq = 1u << 6u;
'''
              new_constants = '''    constexpr std::uint16_t irq_at_ffff = 1u << 5u;
    constexpr std::uint16_t repeat_irq = 1u << 6u;
    constexpr std::uint16_t toggle_irq = 1u << 7u;
'''
          assert text.count(old_constants) == 1, 'timer IRQ constants anchor changed'
          text = text.replace(old_constants, new_constants, 1)

          old_irq = '''        if (irq_enabled && (((mode & repeat_irq) != 0u) || !irq_fired)) {
              bus.interrupt_status = static_cast<std::uint16_t>(
                  bus.interrupt_status | irq_bit);
              if ((mode & repeat_irq) == 0u) irq_fired = true;
          }
          '''
          new_irq = '''        if (irq_enabled && (((mode & repeat_irq) != 0u) || !irq_fired)) {
              bool assert_irq = true;
              if ((mode & toggle_irq) != 0u) {
                  mode = static_cast<std::uint16_t>(
                      mode ^ PsxBus::timer_mode_interrupt_request);
                  assert_irq =
                      (mode & PsxBus::timer_mode_interrupt_request) == 0u;
              }
              if (assert_irq) {
                  bus.interrupt_status = static_cast<std::uint16_t>(
                      bus.interrupt_status | irq_bit);
              }
              if ((mode & repeat_irq) == 0u) irq_fired = true;
          }
          '''
          if old_irq not in text:
              old_irq = '''        if (irq_enabled && (((mode & repeat_irq) != 0u) || !irq_fired)) {
            bus.interrupt_status = static_cast<std::uint16_t>(
                bus.interrupt_status | irq_bit);
            if ((mode & repeat_irq) == 0u) irq_fired = true;
        }
'''
              new_irq = '''        if (irq_enabled && (((mode & repeat_irq) != 0u) || !irq_fired)) {
            bool assert_irq = true;
            if ((mode & toggle_irq) != 0u) {
                mode = static_cast<std::uint16_t>(
                    mode ^ PsxBus::timer_mode_interrupt_request);
                assert_irq =
                    (mode & PsxBus::timer_mode_interrupt_request) == 0u;
            }
            if (assert_irq) {
                bus.interrupt_status = static_cast<std::uint16_t>(
                    bus.interrupt_status | irq_bit);
            }
            if ((mode & repeat_irq) == 0u) irq_fired = true;
        }
'''
          assert text.count(old_irq) == 1, 'timer IRQ block anchor changed'
          text = text.replace(old_irq, new_irq, 1)
          path.write_text(text)
          PY
      - name: Configure timer contract
        run: cmake -S tests/psx_timer1_mode -B build/psx_timer1_mode -DCMAKE_BUILD_TYPE=Release
      - name: Build timer contract
        run: cmake --build build/psx_timer1_mode --parallel 2
      - name: Run timer contract
        run: ./build/psx_timer1_mode/jojo_psx_timer1_mode_tests
      - name: Commit timer toggle semantics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/psx_bus.h
          git commit -m "feat: implement PS1 timer IRQ toggle mode"
          git push origin HEAD:feature/offline-product-rebuild
