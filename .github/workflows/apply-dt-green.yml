name: Apply DT GREEN

on:
  push:
    branches:
      - feature/sh4-dt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic DT edits
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_dt_green.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement SH-4 DT"
          git push origin "HEAD:${GITHUB_REF_NAME}"
