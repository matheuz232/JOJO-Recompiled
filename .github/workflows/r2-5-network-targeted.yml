name: r2-5-network-targeted

on:
  push:
    branches: [feature/r2-5-online-transport]

permissions:
  contents: read

jobs:
  network-targeted:
    if: startsWith(github.event.head_commit.message, '[r2.5-targeted]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone transport contract
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc tests/test_network_transport.cpp src/core/network_protocol.cpp -o network_transport_tests
      - name: Run standalone transport contract
        run: ./network_transport_tests
