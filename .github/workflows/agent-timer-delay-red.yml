name: agent-timer-delay-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-timer-delay-red.yml
      - tests/psx_timer1_mode/main.cpp
      - tests/psx_timer1_mode/timer02_contract.cpp
      - tests/psx_timer1_mode/bios_timer_contract.cpp
      - tests/psx_timer1_mode/timer_sync_contract.cpp
      - tests/psx_timer1_mode/timer_dotclock_contract.cpp
      - tests/psx_timer1_mode/timer_delay_contract.cpp

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply timer hold timing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/core/psx_bus.h')
          text = path.read_text()

          text = text.replace('timer0_reset_pending', 'timer0_reset_hold_cycles')
          text = text.replace('timer1_reset_pending', 'timer1_reset_hold_cycles')
          text = text.replace('timer2_reset_pending', 'timer2_reset_hold_cycles')

          old_fields = "    bool timer0_reset_hold_cycles{};\n    bool timer1_reset_hold_cycles{};\n    bool timer2_reset_hold_cycles{};\n    bool timer0_irq_fired{};\n"
          new_fields = "    std::uint8_t timer0_reset_hold_cycles{};\n    std::uint8_t timer1_reset_hold_cycles{};\n    std::uint8_t timer2_reset_hold_cycles{};\n    std::uint8_t timer0_write_hold_cycles{};\n    std::uint8_t timer1_write_hold_cycles{};\n    std::uint8_t timer2_write_hold_cycles{};\n    bool timer0_irq_fired{};\n"
          assert text.count(old_fields) == 1, 'timer hold fields anchor changed'
          text = text.replace(old_fields, new_fields, 1)

          for timer in range(3):
              current = f'timer{timer}_current'
              reset = f'timer{timer}_reset_hold_cycles'
              write = f'timer{timer}_write_hold_cycles'
              old = f'if (address == PsxBus::{current}_address) {{ bus.{current} = value; bus.{reset} = false; return PsxBusAccessReason::ok; }}'
              new = f'if (address == PsxBus::{current}_address) {{ bus.{current} = value; bus.{reset} = 0u; bus.{write} = 1u; return PsxBusAccessReason::ok; }}'
              assert text.count(old) == 1, f'{current} write anchor changed'
              text = text.replace(old, new, 1)

              old_mode = (
                  f'        bus.{current} = 0u;\n'
                  f'        bus.{reset} = false;\n'
                  f'        bus.timer{timer}_irq_fired = false;\n'
              )
              new_mode = (
                  f'        bus.{current} = 0u;\n'
                  f'        bus.{reset} = 0u;\n'
                  f'        bus.{write} = 1u;\n'
                  f'        bus.timer{timer}_irq_fired = false;\n'
              )
              assert text.count(old_mode) == 1, f'timer{timer} mode reset anchor changed'
              text = text.replace(old_mode, new_mode, 1)

          text, count = re.subn(
              r'bool& reset_pending,\n\s+bool& irq_fired,',
              'std::uint8_t& reset_hold_cycles,\n                                              std::uint8_t& write_hold_cycles,\n                                              bool& irq_fired,',
              text,
              count=1)
          assert count == 1, 'root-counter signature anchor changed'

          old_start = "        if (reset_pending) {\n            current = 0u;\n            reset_pending = false;\n            continue;\n        }\n"
          new_start = "        if (write_hold_cycles != 0u) {\n            --write_hold_cycles;\n            continue;\n        }\n        if (reset_hold_cycles != 0u) {\n            current = 0u;\n            --reset_hold_cycles;\n            continue;\n        }\n"
          assert text.count(old_start) == 1, 'root-counter hold block anchor changed'
          text = text.replace(old_start, new_start, 1)

          old_end = "        if (((mode & reset_at_target) != 0u && hit_target) ||\n            ((mode & reset_at_target) == 0u && hit_ffff)) {\n            reset_pending = true;\n        }\n"
          new_end = "        if ((mode & reset_at_target) != 0u && hit_target) {\n            reset_hold_cycles = 2u;\n        } else if ((mode & reset_at_target) == 0u && hit_ffff) {\n            reset_hold_cycles = 1u;\n        }\n"
          assert text.count(old_end) == 1, 'root-counter reset block anchor changed'
          text = text.replace(old_end, new_end, 1)

          for timer in range(3):
              pattern = rf'bus\.timer{timer}_reset_hold_cycles,(\s*)bus\.timer{timer}_irq_fired'
              repl = rf'bus.timer{timer}_reset_hold_cycles, bus.timer{timer}_write_hold_cycles,\1bus.timer{timer}_irq_fired'
              text, count = re.subn(pattern, repl, text)
              assert count >= 1, f'timer{timer} root-counter call anchors changed'

          path.write_text(text)
          PY
      - name: Configure timer contract
        run: cmake -S tests/psx_timer1_mode -B build/psx_timer1_mode -DCMAKE_BUILD_TYPE=Release
      - name: Build timer contract
        run: cmake --build build/psx_timer1_mode --parallel 2
      - name: Run timer contract
        run: ./build/psx_timer1_mode/jojo_psx_timer1_mode_tests
      - name: Commit timer hold timing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/psx_bus.h
          git commit -m "feat: implement PS1 root-counter hold timing"
          git push origin HEAD:feature/offline-product-rebuild
