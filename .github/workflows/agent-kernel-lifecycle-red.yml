name: agent-kernel-lifecycle-patch

on:
  push:
    branches:
      - feature/offline-product-rebuild
    paths:
      - .github/workflows/agent-kernel-lifecycle-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply BIOS lifecycle implementation
        shell: bash
        run: echo '' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - name: Configure lifecycle contract
        run: cmake -S tests/psx_card_init -B build/psx_card_init -DCMAKE_BUILD_TYPE=Release
      - name: Build lifecycle contract
        run: cmake --build build/psx_card_init --parallel 2
      - name: Run lifecycle contract
        run: ./build/psx_card_init/jojo_psx_card_init_tests
      - name: Commit BIOS lifecycle implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/psx_runtime.h
          git commit -m "feat: implement PS1 BIOS resource lifecycle"
          git push origin HEAD:feature/offline-product-rebuild
