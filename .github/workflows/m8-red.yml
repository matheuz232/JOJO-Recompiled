name: m8-red

on:
  push:
    branches:
      - feature/m8-rollback-networking-core

jobs:
  contract-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile permanent M8 test contract
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc -fsyntax-only tests/test_rollback.cpp
