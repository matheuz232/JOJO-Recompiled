name: m6-red

on:
  push:
    branches: [feature/m6-mod-runtime]
    paths:
      - 'tests/test_semver.cpp'
      - '.github/workflows/m6-red.yml'

jobs:
  semver-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile SemVer RED
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc -c tests/test_semver.cpp -o /tmp/test_semver.o
