name: m6-red

on:
  push:
    branches: [feature/m6-mod-runtime]
    paths:
      - 'tests/test_semver.cpp'
      - 'src/core/semver.h'
      - 'src/core/semver.cpp'
      - 'tests/test_sha256.cpp'
      - 'src/core/sha256.h'
      - 'src/core/sha256.cpp'
      - '.github/workflows/m6-red.yml'

jobs:
  semver-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SemVer test
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc tests/test_semver.cpp src/core/semver.cpp -o /tmp/test_semver
      - name: Run SemVer test
        run: /tmp/test_semver

  sha256-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile SHA-256 RED
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc -c tests/test_sha256.cpp -o /tmp/test_sha256.o
