name: agent-apply-sh4-fpu-completion

on:
  push:
    branches:
      - feature/sh4-cpu-fpu-completion
    paths:
      - .agent/apply_sh4_fpu_completion.py
      - .github/workflows/agent-apply-sh4-fpu-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final SH-4 FPU implementation
        run: python3 .agent/apply_sh4_fpu_completion.py
      - name: Commit implementation and remove applicator
        run: |
          rm .agent/apply_sh4_fpu_completion.py .github/workflows/agent-apply-sh4-fpu-completion.yml
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete SH-4 FPU double vector and exception semantics"
          git push origin HEAD:${GITHUB_REF_NAME}
